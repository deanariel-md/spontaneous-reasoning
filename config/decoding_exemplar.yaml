# Decoding for the eight-exemplar arm. The runner reads it
# with --decoding-yaml. Everything equals config/decoding.yaml's zero_shot_cot arm, whose collection outputs are the
# zero-shot side of the contrast: greedy, the same 3,072-token cap, no extra stop strings, the same engine settings and
# each model's registered kernel mode. The registry is config/models_exemplar.yaml (max_model_len 8,192).
# Checkpoints with a 4,096-token native context use config/decoding_exemplar_4k.yaml.
status: confirmed

temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0

max_new_tokens:
  eight_shot_cot: 3072

stop: []
include_stop_str_in_output: false
skip_special_tokens: true

engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
