# Decoding for the forced-direct arm (added on 2 November 2026).
# The direct-answer prompts of the collection, unchanged; the assistant turn is opened with "\boxed{" and the model
# continues it (vLLM continue_final_message=True, add_generation_prompt=False), at most 16 new tokens, stopping at the
# first "}". The stop string is kept in the output, so "\boxed{" + output is the text the scorer reads and a closed box
# is visible in it. Everything else equals config/decoding.yaml: greedy, the same engine settings, the registered
# kernel mode of each model.
status: confirmed

temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0

max_new_tokens:
  forced_direct: 16

prefill:
  forced_direct: "\\boxed{"

stop: ["}"]
include_stop_str_in_output: true
skip_special_tokens: true

engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
