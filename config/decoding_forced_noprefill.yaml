# Fallback for the forced-direct arm: a model whose
# chat template rejects the "\boxed{" prefill in its 16-request pilot runs the same direct-answer prompts with no
# prefill and a 16-token cap. Its results are flagged as the fallback wherever they appear.
status: confirmed

temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0

max_new_tokens:
  forced_direct: 16

stop: []
include_stop_str_in_output: false
skip_special_tokens: true

engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
