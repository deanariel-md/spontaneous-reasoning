# Size ladder, MATH-500: the three arms of the main panel in one run. direct_answer and zero_shot_cot as
# config/decoding.yaml (the decoding of every MATH-500 collection run with an 8,192-token registry), forced_direct as
# config/decoding_forced_math.yaml (prefill \boxed{, at most 16 new tokens, no stop string since MATH answers may hold
# braces). params_for_arm of every arm equals that of its own file (tests/test_ladder.py).
status: confirmed
temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0
max_new_tokens:
  direct_answer: 1024
  zero_shot_cot: 3072
  forced_direct: 16
prefill:
  forced_direct: "\\boxed{"
stop: []
include_stop_str_in_output: false
skip_special_tokens: true
engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
