# Decoding for the MATH-500 tranche and collection on the four checkpoints whose
# native context is 4,096 tokens (llama-2-7b-chat-hf, llama-2-13b-chat-hf, phi-3-mini-4k-instruct,
# phi-3-medium-4k-instruct). The longest tranche or target prompt is 1,174 tokens
# (a 1,031-token problem, a frame of at most 46 tokens and 100 for the chat template's markup), so the chain-of-thought
# cap is 4,096 - 1,174 = 2,922 rounded down to 2,900. Everything else equals config/decoding.yaml; the screen ran
# with config/decoding.yaml, whose prompts were shorter.
#
# status: confirmed on 3 November 2026 by the authors' decision of 30 October, before any tranche or
# collection output existed.
status: confirmed

temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0

max_new_tokens:
  direct_answer: 1024
  zero_shot_cot: 2900

stop: []
include_stop_str_in_output: false
skip_special_tokens: true

engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
