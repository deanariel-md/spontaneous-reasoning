# Decoding for Llama-2-7b-chat in the reproduction of Cheng et al. (2025): config/decoding_reproduction.yaml with
# output caps that fit its 4,096-token context. The longest rendered prompt
# is at most 256 tokens in zero-shot arms and 1,408 in eight-shot arms (published frames and the eight transport
# configurations), so the caps are 4,096 minus those. Fixed on 31 October 2026 with the protocol.
status: confirmed

temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0

max_new_tokens:
  zero_shot_cot: 3840
  eight_shot_cot: 2688

stop: ["</s>", "<|im_end|>", "<|endoftext|>", "\n\nQuestion:", "<|end_of_text|>", " Question", "\n[Question]", "<eoa>", "<|user|>"]
include_stop_str_in_output: false
skip_special_tokens: true

engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
