# Native reasoning with the vendors' sampling settings (the run was accepted on
# 17 November 2026). Read by scripts/thinking_vendor_generate.py; the main runner (src/generation.py) stays greedy.
#
# Rule: each checkpoint's model card, at the revision pinned for the native-reasoning runs, recommends sampling settings per mode. The run
# takes the card's "Thinking mode for general tasks" line: the cards name no math-specific setting, and their other
# thinking-mode line is for "precise coding tasks (e.g. WebDev)". The cards were fetched by scripts/fetch_vendor_cards.py
# (README.md and generation_config.json; the card's sha256 is below). generation_config.json
# agrees with the card on temperature, top_p and top_k for all three; it carries no presence penalty.
#
# Everything else is as in the native-reasoning runs: the requested-direct prompts with the thinking switch on, the chat template, revision,
# dtype and engine settings of config/models_thinking_<task>.yaml, special tokens kept in the output, the 30,720-token cap,
# no stop strings, the RTX PRO 6000. max_model_len is 32,768 for both tasks (those runs used 31,744 on GSM8K and 32,768 on
# MATH-500; the context length bounds the prompt plus the cap and does not change an output).
# Seed: the engine seed is 0 and every request carries SamplingParams seed 0, so an output does not depend on which
# other requests share its batch or on a restart.
