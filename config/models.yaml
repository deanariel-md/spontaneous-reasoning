# Model panels. Dataset 1 panel fixed by the structural audit;
# Dataset 2 panel fixed from an external index, never from target scores.
dataset1:
  source: nlphuji/DOVE_Lite@bc1129e223f3f48f0e4180694cde261e02da685e
  rule: models with zero-shot and five-shot files for the MMLU block (structure only)
  panel:
    - {dove_dir: Llama-3.2-1B-Instruct, hf_id: meta-llama/Llama-3.2-1B-Instruct, family: Llama, quantization: float16}
    - {dove_dir: Llama-3.2-3B-Instruct, hf_id: meta-llama/Llama-3.2-3B-Instruct, family: Llama, quantization: float16}
    - {dove_dir: Meta-Llama-3-8B-Instruct, hf_id: meta-llama/Meta-Llama-3-8B-Instruct, family: Llama, quantization: float16}
    - {dove_dir: Mistral-7B-Instruct-v0.3, hf_id: mistralai/Mistral-7B-Instruct-v0.3, family: Mistral, quantization: float16}
    - {dove_dir: OLMoE-1B-7B-0924-Instruct, hf_id: allenai/OLMoE-1B-7B-0924-Instruct, family: OLMoE, quantization: float16}
  decoding_and_templates: as released by DOVE; not recoverable from DOVE_Lite beyond the fields above
dataset2:
  status: panel fixed on 30 October 2026 by rule from Epoch's Capabilities Index (manifests/d2_panel.json);
          entries are added as each repository becomes readable
  target: about 20 open instruction-tuned checkpoints across 4-6 families
  pin_fields: [checkpoint_revision, chat_template_hash, quantization, decoding, max_new_tokens, native_reasoning_off, library_versions]
  panel: []
  # Generation registry read by src/generation.py (schema version 1). One entry per model_key, added
  # only after the panel is fixed from an external index (manifests/).
  # `_template` documents the schema; any value starting with PLACEHOLDER, or a
  # revision that is not a 40-hex commit sha, makes the runner refuse to start.
  registry_schema_version: 1
  models:
    _template:
      family: PLACEHOLDER              # optional, copied to the run log
      hf_id: PLACEHOLDER               # e.g. org/name
      revision: PLACEHOLDER            # exact 40-hex commit sha of hf_id; branch names are refused
      dtype: bfloat16                  # bfloat16 | float16 | float32
      quantization: none               # none, or the vLLM quantization method actually used
      tokenizer_mode: auto             # passed to vLLM; pin explicitly for Mistral-format repos
      max_model_len: 4096              # must cover the longest prompt plus the arm's max_new_tokens
      tensor_parallel_size: 1          # GPUs per job; the GPU request is read from here
      chat_template:
        source: tokenizer_default      # tokenizer_default | file
        file: null                     # path from the repo root when source is file
        sha256: null                   # sha256 of the template string; freeze from the throughput
                                       # run log (chat_template.observed_sha256); a full run
                                       # refuses while null, and refuses on a mismatch
      thinking_off:                    # how native reasoning is disabled, identically in both arms
        method: chat_template_kwargs   # chat_template_kwargs | system_prompt_token | none_needed
        chat_template_kwargs: {enable_thinking: false}   # used when method is chat_template_kwargs
        system_prompt_token: null      # used when method is system_prompt_token, e.g. "/no_think"
        rationale: null                # required text when method is none_needed
      kernels: batch_invariant         # batch_invariant | default. The runner sets
                                       # VLLM_BATCH_INVARIANT=1 and TORCHINDUCTOR_BATCH_INVARIANT=1 for
                                       # batch_invariant and refuses a conflicting environment. default only for an
                                       # architecture with Mamba or linear-attention layers, for which vLLM 0.30.0
                                       # refuses batch-invariant mode
    # Panel entries: drafted by scripts/draft_registry.py from manifests/d2_panel.json, with the chat
    # template sha256 read from each repository's own files at the pinned revision (the runner refuses a mismatch),
    # tokenizer_mode hf for Mistral repositories so that the hashed Jinja template renders the prompt, and
    # Mistral-Small-3.1's template pinned with a fixed date (config/chat_templates/).
    gemma-4-31b-it:
