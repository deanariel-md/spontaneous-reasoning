# Registry of the 11 checkpoints the extension adds to the Dataset 2 panel. Same schema as config/models.yaml, which
# holds the main 19-model registry. Drafted by scripts/draft_registry.py from manifests/d2_panel_extension.json at the
# revisions fixed in manifests/external/hf_metadata_20261030.json (config/models_draft_extension*.{yaml,json,md}); template
# hashes computed from each revision's tokenizer files and equal to the family templates already in the registry;
# Gemma 2 and 3 have no thinking switch (none_needed, as for gemma-3-12b-it). The three Qwen3.5/3.6 checkpoints have
# linear-attention layers, so they run with default kernels and the scheduler limit of qwen3.6-27b (512
