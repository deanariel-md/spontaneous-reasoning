# Size ladder: four instruct checkpoints, thinking
# off, run with the main panel's complete design (requested, chain-of-thought, forced and five-shot arms; GSM8K,
# MATH-500, BIG-Bench Hard, HotpotQA; the panel's request files, items, configurations and decoding per arm, the
# requested and chain-of-thought caps raised to 7,000 with a token-level cut at the panel's cap; strict and content
# scoring). src/ladder.py holds the active list (MODELS) and the dropped one (DROPPED).
# Revisions and file sizes read from the Hugging Face API on 22 November 2026. Chat-template sha256 values computed
# from each repository's tokenizer files at the pinned revision with transformers (the method gives the main registry's
# values: Llama-3.1-70B's template equals llama-3.1-8b-instruct's, e10ca381...; Qwen3.5-122B's equals qwen3.5-9b's,
# a4aee8af...). Library versions: the d2 environment on the cluster, vLLM 0.30.0, torch 2.13.0+cu130, transformers
# 5.16.1 (results/ladder/inventory.out); each run log records them.
#
# Every model has two keys: <key> with batch-invariant kernels (as the main panel), and <key>-dk with vLLM's default
# kernels, which the pilot job runs only when the batch-invariant engine fails to load. The -dk key answers its base
# key's request file (requests_model_key). The pilot check records which key loaded; the full jobs read it from
# <out>/ladder/chosen/<key> (<out> is the run's output directory).
#
# max_model_len: the smallest multiple of 1,024, at least 8,192, that holds every request's prompt (rendered with the
# model's own template) plus its arm's cap (7,000 on the raised arms); measured by scripts/ladder_prompt_lengths.py
# (results/ladder/prompt_lengths.json). The runner checks every prompt again before generating.
#
# Fields beyond the main registry's (src/generation.py, "Size ladder"): pipeline_parallel_size, renderer, prefill_mode,
# gpu_memory_utilization, quantization_source, requests_model_key, text_only. Each is absent from every main-panel entry.
# Entries marked ladder_status: dropped are kept as the record of the outputs they produced; no job runs them.
dataset2:
  models:
    # Llama ladder: llama-3.1-8b-instruct -> Llama-3.1-70B-Instruct, the same Llama 3.1 release. Meta publishes no FP8
    # checkpoint of the 70B (its FP8 release is the 405B only); RedHatAI's FP8-dynamic quantization of Meta's model
    # (compressed-tensors: FP8 weights per channel, activations per token at run time, lm_head in 16 bits,
    # kv_cache_scheme null) keeps the KV cache in 16 bits as the panel does.
    # NVIDIA's FP8 release (nvidia/Llama-3.1-70B-Instruct-FP8) is a ModelOpt checkpoint; not used. Weights 72.7 GB; at
    # 0.95 of one 96 GB card about 17 GB is left for the KV cache (320 KB per token in 16 bits; the Llama-3.3 pilot
    # measured 56,928 tokens). The model card names the base model meta-llama/Meta-Llama-3.1-70B-Instruct (now
    # meta-llama/Llama-3.1-70B-Instruct) without a revision; base_model records Meta's repository at its current
    # revision on 22 November 2026, whose chat template equals this checkpoint's.
    llama-3.1-70b-instruct-fp8:
      family: Llama
      ladder_of: llama-3.1-8b-instruct
      hf_id: RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8-dynamic
      base_model: meta-llama/Llama-3.1-70B-Instruct@1605565b47bb9346c5515c34102e054115b4f98b
      revision: e5718dbb1f3c4ec839a87d8e434954f6339d9a07   # 72.7 GB safetensors
      dtype: bfloat16
      quantization: compressed-tensors
      quantization_source: checkpoint
      tokenizer_mode: auto
      max_model_len: 10240
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.95
      chat_template:
        source: tokenizer_default
        file: null
        sha256: e10ca381b1ccc5cf9db52e371f3b6651576caee0a630b452e2816b2d404d4b65
