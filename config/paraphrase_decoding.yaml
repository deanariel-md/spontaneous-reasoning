# Decoding for the one paraphrase request of the Dataset 2 bank (config/paraphraser.yaml).
# Greedy, as PromptSuite's hosted call (temperature 0.0), and the same engine settings as config/decoding.yaml.
# The cap leaves room for the Python list PromptSuite asks for; a truncated answer is refused when the record is
# frozen (scripts/paraphrase_d2.py freeze), because PromptSuite could not parse it.
status: confirmed
temperature: 0.0
top_p: 1.0
top_k: 0
seed: 0
max_new_tokens:
  paraphrase: 2048
stop: []
include_stop_str_in_output: false
skip_special_tokens: true
engine:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  max_num_seqs: null
  max_num_batched_tokens: null
  generation_config: auto
